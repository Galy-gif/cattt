name: checks

on:
  push:
    branches: [main, web-desktop]
  pull_request:
  workflow_dispatch:

jobs:
  repo-web-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: maomao
          POSTGRES_PASSWORD: maomao
          POSTGRES_DB: cattt_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U maomao -d cattt_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 仓库内容（大文件、日志、文档登记）
        run: python3 tools/repo_check.py --all
      - name: 网页：安装、类型检查、测试
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test:app
      - name: 后端安装与类型检查
        run: |
          pnpm --dir server install --frozen-lockfile
          pnpm --dir server typecheck
      - name: 后端数据库迁移与集成测试
        env:
          DATABASE_URL: postgres://maomao:maomao@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/cattt_test
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
          MODEL_PROVIDER: mock
        run: |
          pnpm --dir server db:migrate
          pnpm --dir server test --maxWorkers=1

  swift-and-shared-rules:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 跨端规则（行为表、氛围关键帧、地点、场景版本、生成物）
        run: python3 tools/check_shared_rules.py
      - name: iOS 世界层逻辑测试
        run: sh tools/check_world_logic.sh
      - name: Swift 日记游标与事项请求同步测试
        run: |
          sh tools/check_diary_logic.sh
          sh tools/check_sync_requests.sh
