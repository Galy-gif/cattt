<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    a { color: #C25A3E; } a:hover { color: #9E4630; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #DCE6D6; display: flex; flex-direction: column;">

  <!-- 标题区 -->
  <div style="padding: 62px 22px 14px; display: flex; flex-direction: column; gap: 3px;">
    <span style="font-size: 12px; letter-spacing: .12em; color: #61705A;">九月七日 · 星期一</span>
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 30px; color: #26301F; letter-spacing: .02em;">今天</h1>
      <div style="display: flex; gap: 16px; align-items: center; color: rgba(38,48,31,.45);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M16.2 16.2 L21 21"/></svg>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 8 L12 15 L19 8"/></svg>
      </div>
    </div>
  </div>

  <!-- 时间线 -->
  <div style="flex: 1; overflow: hidden; padding: 6px 22px 0; display: flex; flex-direction: column; gap: 16px;">

    <!-- 语音碎片 -->
    <div style="display: grid; grid-template-columns: 44px 1fr; gap: 10px;">
      <span style="font-size: 11px; color: #61705A; padding-top: 12px; letter-spacing: .04em; font-variant-numeric: tabular-nums;">08:40</span>
      <div style="background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 13px 14px; display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#61705A" stroke-width="1.8" stroke-linecap="round"><path d="M4 10 v4 M8.5 6 v12 M13 9 v6 M17.5 4 v16 M22 11 v2"/></svg>
          <span style="font-size: 11px; color: #61705A; letter-spacing: .06em;">语音 · 0:14</span>
        </div>
        <p style="margin: 0; font-size: 14.5px; line-height: 1.75; color: #26301F;">早班地铁太挤了，站了一路。不过出站的时候看到有人在卖桂花。</p>
        <span style="font-size: 10.5px; color: #8A9683; letter-spacing: .04em;">原始转写，未整理</span>
      </div>
    </div>

    <!-- 团子的留言 -->
    <div style="display: grid; grid-template-columns: 44px 1fr; gap: 10px;">
      <span style="font-size: 11px; color: #61705A; padding-top: 14px; letter-spacing: .04em;">稍后</span>
      <div style="background: #F6EEDC; border: 1px solid #E0D4B4; border-radius: 3px; padding: 13px 14px 12px; margin-left: 16px; display: flex; flex-direction: column; gap: 8px; position: relative;">
        <span style="position: absolute; left: -13px; top: 15px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: #F6EEDC; border-radius: 11px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#C9823F"><ellipse cx="12" cy="15.5" rx="5.6" ry="4.4"/><circle cx="6.6" cy="9.6" r="2.1"/><circle cx="11" cy="7.4" r="2.2"/><circle cx="15.6" cy="8.4" r="2.1"/></svg>
        </span>
        <p style="margin: 0; font-size: 14.5px; line-height: 1.75; color: #26301F;">桂花开了就是要下雨了。你回来那天，我在窗台等。</p>
        <span style="font-size: 10.5px; color: #A8865A; letter-spacing: .04em;">团子</span>
      </div>
    </div>

    <!-- 照片碎片 -->
    <div style="display: grid; grid-template-columns: 44px 1fr; gap: 10px;">
      <span style="font-size: 11px; color: #61705A; padding-top: 12px; letter-spacing: .04em; font-variant-numeric: tabular-nums;">13:12</span>
      <div style="background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 13px 14px; display: flex; flex-direction: column; gap: 10px;">
        <div style="height: 108px; border-radius: 2px; background: linear-gradient(160deg, #C6D9C4, #9FC0C2 62%, #B0C8AD); display: flex; align-items: flex-end; padding: 9px;">
          <span style="font-size: 10px; color: rgba(38,48,31,.5); letter-spacing: .05em;">照片</span>
        </div>
        <p style="margin: 0; font-size: 14.5px; line-height: 1.75; color: #26301F;">午休的时候楼下那只三花又来了。</p>
      </div>
    </div>

    <!-- 文字碎片 · 只留给自己 -->
    <div style="display: grid; grid-template-columns: 44px 1fr; gap: 10px;">
      <span style="font-size: 11px; color: #61705A; padding-top: 12px; letter-spacing: .04em; font-variant-numeric: tabular-nums;">21:05</span>
      <div style="background: #E6ECDF; border: 1px dashed #B9C7AF; border-radius: 3px; padding: 13px 14px; display: flex; flex-direction: column; gap: 8px;">
        <p style="margin: 0; font-size: 14.5px; line-height: 1.75; color: #414C39;">还是没想好要不要跟她说。</p>
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#61705A" stroke-width="1.9"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5 V7.5 a3.5 3.5 0 0 1 7 0 v3"/></svg>
          <span style="font-size: 10.5px; color: #61705A; letter-spacing: .04em;">只留给自己</span>
        </div>
      </div>
    </div>

  </div>

  <!-- 记一下 -->
  <div style="padding: 10px 22px 0; display: flex; justify-content: flex-end;">
    <button style="display: flex; align-items: center; gap: 7px; min-height: 46px; padding: 0 19px; border: 0; border-radius: 4px; background: #C25A3E; color: #F8EDE6; font-size: 14.5px; font-family: inherit; letter-spacing: .08em; box-shadow: 0 2px 0 #9E4630; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5 v14 M5 12 h14"/></svg>
      记一下
    </button>
  </div>

  <nav style="display: flex; background: rgba(220,230,214,.96); border-top: 1px solid #C3D0BA; margin-top: 12px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 22px; color: rgba(38,48,31,.42);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M9.6 21.6 C8.4 21.6 7.9 20.9 7.9 19.9 L7.9 15.6 C7.9 14.1 8.2 13 8.8 12 C8.4 10.4 8.4 8.4 8.7 6.6 L8.2 2.2 C8.1 1.5 8.6 1.2 9.2 1.6 L13.1 4 C14.4 3.7 15.6 3.7 16.9 4 L20.8 1.6 C21.4 1.2 21.9 1.5 21.8 2.2 L21.3 6.6 C21.6 8.4 21.6 10.4 21.2 12 C21.8 13 22.1 14.1 22.1 15.6 L22.1 19.9 C22.1 20.9 21.6 21.6 20.4 21.6 Z"/><path d="M9 20.4 C6.2 21.2 3.4 19.6 2.7 16.8 C2.1 14.4 3.2 12.2 5.1 11.6" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round"/></svg>
      <span style="font-size: 10px; letter-spacing: .1em;">陪伴</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 22px; color: #26301F;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5.5 3.5 h13 v17 h-13 Z"/><path d="M8.5 8 h7 M8.5 11.6 h7 M8.5 15.2 h4.5"/></svg>
      <span style="font-size: 10px; letter-spacing: .1em;">日记</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 22px; color: rgba(38,48,31,.42);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8.4" r="3.8"/><path d="M5 20.5 c0 -3.9 3.1 -6.5 7 -6.5 s7 2.6 7 6.5"/></svg>
      <span style="font-size: 10px; letter-spacing: .1em;">我的</span>
    </div>
  </nav>

</div>
</x-dc>

</body>
</html>
