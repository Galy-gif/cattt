<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    a { color: #C25A3E; } a:hover { color: #9E4630; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #DCE6D6; display: flex; flex-direction: column;">

  <div style="padding: 56px 24px 0; display: flex; align-items: center; gap: 14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#61705A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 4.6 L7.8 12 L15.2 19.4"/></svg>
    <div style="flex: 1; height: 3px; background: #C3D0BA; border-radius: 2px; overflow: hidden;">
      <div style="width: 50%; height: 3px; background: #C25A3E;"></div>
    </div>
    <span style="font-size: 11.5px; color: #61705A; font-variant-numeric: tabular-nums;">2 / 4</span>
  </div>

  <div style="padding: 26px 24px 16px;">
    <h1 style="margin: 0 0 8px; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 25px; color: #26301F;">它是什么脾气</h1>
    <p style="margin: 0; font-size: 13.5px; line-height: 1.85; color: #61705A;">这决定它主不主动、话多不多、多久才跟你熟。之后还能改。</p>
  </div>

  <div style="flex: 1; padding: 0 24px; display: flex; flex-direction: column; gap: 11px; overflow: hidden;">
    <sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
      <div onClick="{{p.pick}}" style="{{p.box}}">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="{{p.nameStyle}}">{{p.name}}</span>
          <sc-if value="{{p.selected}}" hint-placeholder-val="{{ true }}">
            <span style="margin-left: auto;">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C25A3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg>
            </span>
          </sc-if>
        </div>
        <p style="margin: 7px 0 0; font-size: 13.5px; line-height: 1.8; color: #414C39;">{{p.behavior}}</p>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px 24px 44px; display: flex; flex-direction: column; gap: 13px;">
    <div style="display: flex; justify-content: center;">
      <span style="font-size: 13px; color: #61705A; border-bottom: 1px solid #A7B2A0; padding-bottom: 3px;">想再细调四个特征</span>
    </div>
    <button style="width: 100%; min-height: 52px; border: 0; border-radius: 4px; background: #C25A3E; color: #F8EDE6; font-size: 16px; font-family: inherit; letter-spacing: .1em; box-shadow: 0 2px 0 #9E4630; cursor: pointer;">
      下一步
    </button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'slow' }; }
  renderVals() {
    const raw = [
      { id: 'slow',  name: '慢热', behavior: '头几天话很少，也不怎么问你。熟了之后会主动提起你说过的事。' },
      { id: 'close', name: '黏人', behavior: '每天会来找你一两次。你不回也不会追问，第二天照常来。' },
      { id: 'quiet', name: '安静', behavior: '几乎不主动。你说话它就在，你不说它也不打扰。' },
      { id: 'curio', name: '好奇', behavior: '爱追问细节。你提一句，它可能隔天还会想起来接着问。' },
    ];
    const presets = raw.map((p) => {
      const sel = this.state.picked === p.id;
      return {
        ...p,
        selected: sel,
        pick: () => this.setState({ picked: p.id }),
        box: 'padding:15px 16px;border-radius:4px;cursor:pointer;'
           + 'border:1px solid ' + (sel ? '#C25A3E' : '#C3D0BA') + ';'
           + 'background:' + (sel ? '#F6EEDC' : '#F4F2E6') + ';',
        nameStyle: 'font-family:"Noto Serif SC",serif;font-size:17px;font-weight:500;color:'
           + (sel ? '#9E4630' : '#26301F') + ';letter-spacing:.06em;',
      };
    });
    return { presets };
  }
}
</script>
</body>
</html>
