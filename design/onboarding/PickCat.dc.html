<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    a { color: #C25A3E; } a:hover { color: #9E4630; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #DCE6D6; display: flex; flex-direction: column;">

  <div style="padding: 56px 24px 0; display: flex; align-items: center; gap: 14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#61705A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 4.6 L7.8 12 L15.2 19.4"/></svg>
    <div style="flex: 1; height: 3px; background: #C3D0BA; border-radius: 2px; overflow: hidden;">
      <div style="width: 25%; height: 3px; background: #C25A3E;"></div>
    </div>
    <span style="font-size: 11.5px; color: #61705A; font-variant-numeric: tabular-nums;">1 / 4</span>
  </div>

  <div style="padding: 26px 24px 18px;">
    <h1 style="margin: 0 0 8px; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 25px; color: #26301F;">先看看是哪一只</h1>
    <p style="margin: 0; font-size: 13.5px; line-height: 1.85; color: #61705A;">外观和性格是分开的。挑哪只都不会影响它的脾气。</p>
  </div>

  <div style="flex: 1; padding: 0 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">

    <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
      <div onClick="{{c.pick}}" style="{{c.box}}">
        <div style="{{c.avatar}}">
          <sc-if value="{{c.ready}}" hint-placeholder-val="{{ true }}">
            <svg width="52" height="50" viewBox="0 0 200 190">
              <g stroke="#6B5B4A" stroke-width="6" stroke-linejoin="round">
                <path d="M134 158 C170 156 182 124 164 108 C152 97 138 107 146 118" fill="none" stroke-width="22"/>
                <path d="M134 158 C170 156 182 124 164 108 C152 97 138 107 146 118" fill="none" stroke="{{c.fur}}" stroke-width="15"/>
                <path d="M66 40 L54 6 L96 26 Z" fill="{{c.fur}}"/><path d="M134 40 L146 6 L104 26 Z" fill="{{c.fur}}"/>
                <path d="M62 168 C56 124 72 92 100 92 C128 92 144 124 138 168 Z" fill="{{c.fur}}"/>
                <path d="M79 168 C75 142 85 122 100 122 C115 122 125 142 121 168 Z" fill="{{c.chest}}" stroke-width="4"/>
                <ellipse cx="100" cy="66" rx="44" ry="40" fill="{{c.fur}}"/>
                <ellipse cx="76" cy="74" rx="12.5" ry="14.5" fill="#F2D46A"/><ellipse cx="124" cy="74" rx="12.5" ry="14.5" fill="#F2D46A"/>
                <ellipse cx="76" cy="75" rx="8.5" ry="11.5" fill="#3A3229" stroke="none"/>
                <ellipse cx="124" cy="75" rx="8.5" ry="11.5" fill="#3A3229" stroke="none"/>
                <path d="M92 101 Q100 95 108 101" fill="none" stroke-width="5"/>
              </g>
            </svg>
          </sc-if>
          <sc-if value="{{c.pending}}" hint-placeholder-val="{{ false }}">
            <svg width="40" height="38" viewBox="0 0 200 190" opacity=".3">
              <g fill="#8A9683"><path d="M66 40 L54 6 L96 26 Z"/><path d="M134 40 L146 6 L104 26 Z"/>
              <path d="M62 168 C56 124 72 92 100 92 C128 92 144 124 138 168 Z"/>
              <ellipse cx="100" cy="66" rx="44" ry="40"/></g>
            </svg>
          </sc-if>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <span style="{{c.nameStyle}}">{{c.name}}</span>
          <span style="font-size: 12.5px; color: #61705A; line-height: 1.6;">{{c.note}}</span>
        </div>
        <sc-if value="{{c.selected}}" hint-placeholder-val="{{ true }}">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C25A3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M5 12.5 L10 17.5 L19 7"/></svg>
        </sc-if>
      </div>
    </sc-for>

  </div>

  <div style="padding: 18px 24px 44px;">
    <button style="width: 100%; min-height: 52px; border: 0; border-radius: 4px; background: #C25A3E; color: #F8EDE6; font-size: 16px; font-family: inherit; letter-spacing: .1em; box-shadow: 0 2px 0 #9E4630; cursor: pointer;">
      就它了
    </button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'orange' }; }
  renderVals() {
    const raw = [
      { id: 'orange', name: '橘猫',   note: '偏胖，毛厚，尾巴有环纹',       fur: '#E3A05C', chest: '#F2E4C8', ready: true },
      { id: 'cow',    name: '奶牛猫', note: '黑白，白鼻梁偏一侧 · 待定稿', fur: '#A7B2A0', chest: '#E6ECDF', ready: false },
      { id: 'black',  name: '黑猫',   note: '高耳，腿略长 · 待定稿',       fur: '#A7B2A0', chest: '#E6ECDF', ready: false },
      { id: 'calico', name: '三花',   note: '梨形身体，大块花纹 · 待定稿', fur: '#A7B2A0', chest: '#E6ECDF', ready: false },
    ];
    const cats = raw.map((c) => {
      const sel = c.ready && this.state.picked === c.id;
      return {
        ...c,
        pending: !c.ready,
        selected: sel,
        pick: () => { if (c.ready) this.setState({ picked: c.id }); },
        box: 'display:flex;align-items:center;gap:14px;padding:14px 15px;border-radius:4px;'
           + 'border:1px solid ' + (sel ? '#C25A3E' : '#C3D0BA') + ';'
           + 'background:' + (c.ready ? (sel ? '#F6EEDC' : '#F4F2E6') : '#D6E0CF') + ';'
           + (c.ready ? 'cursor:pointer;' : 'cursor:default;'),
        avatar: 'width:58px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;',
        nameStyle: 'font-size:15.5px;font-weight:600;color:' + (c.ready ? '#26301F' : '#61705A') + ';',
      };
    });
    return { cats };
  }
}
</script>
</body>
</html>
