<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    a { color: #C25A3E; } a:hover { color: #9E4630; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #DCE6D6; display: flex; flex-direction: column;">

  <div style="padding: 56px 24px 0; display: flex; align-items: center; gap: 14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#61705A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 4.6 L7.8 12 L15.2 19.4"/></svg>
    <div style="flex: 1; height: 3px; background: #C3D0BA; border-radius: 2px; overflow: hidden;">
      <div style="width: 75%; height: 3px; background: #C25A3E;"></div>
    </div>
    <span style="font-size: 11.5px; color: #61705A; font-variant-numeric: tabular-nums;">3 / 4</span>
  </div>

  <div style="padding: 26px 24px 0;">
    <h1 style="margin: 0 0 8px; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 25px; color: #26301F;">给它起个名字</h1>
    <p style="margin: 0; font-size: 13.5px; line-height: 1.85; color: #61705A;">它会用这个名字认自己。以后也能改。</p>
  </div>

  <!-- 木牌上的名字 -->
  <div style="padding: 34px 24px 0; display: flex; justify-content: center;">
    <div style="position: relative; width: 244px;">
      <div style="background: #D9C39C; border: 2px solid #6B5B4A; border-radius: 5px; padding: 22px 18px; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'Noto Serif SC', serif; font-size: 30px; font-weight: 700; color: #414C39; letter-spacing: .16em;">团子</span>
      </div>
      <div style="width: 13px; height: 42px; background: #C7A882; border: 2px solid #6B5B4A; border-top: 0; margin: 0 auto; border-radius: 0 0 3px 3px;"></div>
    </div>
  </div>

  <div style="padding: 30px 24px 0;">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 54px; background: #F4F2E6; border: 1px solid #C25A3E; border-radius: 4px; padding: 0 16px;">
      <span style="flex: 1; font-size: 17px; color: #26301F; letter-spacing: .06em;">团子</span>
      <span style="font-size: 12px; color: #8A9683; font-variant-numeric: tabular-nums;">2 / 8</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;">
      <span style="font-size: 13.5px; color: #414C39; background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 7px 14px;">团子</span>
      <span style="font-size: 13.5px; color: #414C39; background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 7px 14px;">橘子</span>
      <span style="font-size: 13.5px; color: #414C39; background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 7px 14px;">阿黄</span>
      <span style="font-size: 13.5px; color: #414C39; background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 7px 14px;">豆沙</span>
      <span style="font-size: 13.5px; color: #414C39; background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 7px 14px;">再换一批</span>
    </div>
  </div>

  <div style="flex: 1;"></div>

  <div style="padding: 0 24px 20px;">
    <div style="display: flex; align-items: flex-start; gap: 11px; background: #CEDCC7; border-radius: 4px; padding: 13px 15px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#61705A" stroke-width="1.8" style="flex: none; margin-top: 2px;"><circle cx="12" cy="12" r="8.4"/><path d="M12 11 v5.4 M12 7.6 v.6"/></svg>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.8; color: #61705A;">它还会问你想让它怎么称呼你。那个可以等第一次见面时再说。</p>
    </div>
  </div>

  <div style="padding: 0 24px 44px;">
    <button style="width: 100%; min-height: 52px; border: 0; border-radius: 4px; background: #C25A3E; color: #F8EDE6; font-size: 16px; font-family: inherit; letter-spacing: .1em; box-shadow: 0 2px 0 #9E4630; cursor: pointer;">
      下一步
    </button>
  </div>

</div>
</x-dc>
