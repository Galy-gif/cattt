<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    a { color: #C25A3E; } a:hover { color: #9E4630; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #DCE6D6; display: flex; flex-direction: column;">

  <!-- 团子本人，不是账户头像 -->
  <div style="padding: 58px 22px 20px; background: linear-gradient(178deg, #CBDFCA, #E4E7DA 78%, #DCE6D6); display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <svg width="128" height="118" viewBox="0 0 200 190">
      <g stroke="#6B5B4A" stroke-width="3" stroke-linejoin="round">
        <path d="M134 158 C170 156 182 124 164 108 C152 97 138 107 146 118" fill="none" stroke-width="16"/>
        <path d="M134 158 C170 156 182 124 164 108 C152 97 138 107 146 118" fill="none" stroke="#E3A05C" stroke-width="12"/>
        <path d="M66 40 L54 6 L96 26 Z" fill="#E3A05C"/><path d="M134 40 L146 6 L104 26 Z" fill="#E3A05C"/>
        <path d="M71 35 L63 12 L88 27 Z" fill="#E5A5A0" stroke-width="2"/><path d="M129 35 L137 12 L112 27 Z" fill="#E5A5A0" stroke-width="2"/>
        <path d="M62 168 C56 124 72 92 100 92 C128 92 144 124 138 168 Z" fill="#E3A05C"/>
        <path d="M79 168 C75 142 85 122 100 122 C115 122 125 142 121 168 Z" fill="#F2E4C8" stroke-width="2"/>
        <rect x="71" y="157" width="25" height="18" rx="9" fill="#E3A05C"/>
        <rect x="104" y="157" width="25" height="18" rx="9" fill="#E3A05C"/>
        <ellipse cx="100" cy="66" rx="44" ry="40" fill="#E3A05C"/>
        <path d="M86 34 L82 21 M100 31 L100 18 M114 34 L118 21" stroke="#C9823F" stroke-width="2.6"/>
        <ellipse cx="76" cy="74" rx="12.5" ry="14.5" fill="#F2D46A"/><ellipse cx="124" cy="74" rx="12.5" ry="14.5" fill="#F2D46A"/>
        <ellipse cx="76" cy="75" rx="8.5" ry="11.5" fill="#3A3229" stroke="none"/>
        <ellipse cx="124" cy="75" rx="8.5" ry="11.5" fill="#3A3229" stroke="none"/>
        <path d="M67 65 L59 59" stroke-width="2.6"/><path d="M133 65 L141 59" stroke-width="2.6"/>
        <path d="M95 87 L105 87 L100 93 Z" fill="#C08878" stroke-width="2"/>
        <path d="M92 101 Q100 95 108 101" fill="none" stroke-width="2.6"/>
        <path d="M60 82 L18 75 M60 91 L16 91 M140 82 L182 75 M140 91 L184 91" stroke-width="1.9" opacity=".85"/>
      </g>
    </svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 25px; color: #26301F; letter-spacing: .06em;">团子</h1>
      <span style="font-size: 12.5px; color: #61705A; letter-spacing: .04em;">在一起 214 天</span>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 22px;">

    <!-- 我们怎么相处 -->
    <section style="display: flex; flex-direction: column; gap: 11px;">
      <h2 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 15px; color: #414C39; letter-spacing: .08em;">我们怎么相处</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span style="font-size: 13px; color: #414C39; background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 7px 13px;">不太主动</span>
        <span style="font-size: 13px; color: #414C39; background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 7px 13px;">话少</span>
        <span style="font-size: 13px; color: #414C39; background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 7px 13px;">记得住事</span>
        <span style="font-size: 13px; color: #414C39; background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; padding: 7px 13px;">不劝你</span>
      </div>
      <p style="margin: 2px 0 0; font-size: 13px; line-height: 1.8; color: #61705A;">团子每天最多主动找你一到两次。你不回也没关系。</p>
    </section>

    <!-- 记忆与边界 -->
    <section style="display: flex; flex-direction: column; gap: 11px;">
      <h2 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 15px; color: #414C39; letter-spacing: .08em;">它记得的事</h2>
      <div style="background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; overflow: hidden;">
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 15px; min-height: 46px; box-sizing: border-box;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#61705A" stroke-width="1.7" style="flex: none;"><path d="M5 4 h11 l3 3 v13 h-14 Z"/><path d="M8.5 11 h7 M8.5 15 h4.5"/></svg>
          <span style="flex: 1; font-size: 14.5px; color: #26301F;">长期记忆</span>
          <span style="font-size: 13px; color: #8A9683; font-variant-numeric: tabular-nums;">37 条</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A7B2A0" stroke-width="2" style="flex: none;"><path d="M9 5 L16 12 L9 19"/></svg>
        </div>
        <div style="height: 1px; background: #E3E9DB; margin-left: 45px;"></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 15px; min-height: 46px; box-sizing: border-box;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#61705A" stroke-width="1.7" style="flex: none;"><circle cx="12" cy="12" r="8"/><path d="M12 8 v4.5 l3 2"/></svg>
          <span style="flex: 1; font-size: 14.5px; color: #26301F;">在聊的话题</span>
          <span style="font-size: 13px; color: #8A9683; font-variant-numeric: tabular-nums;">4 个</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A7B2A0" stroke-width="2" style="flex: none;"><path d="M9 5 L16 12 L9 19"/></svg>
        </div>
        <div style="height: 1px; background: #E3E9DB; margin-left: 45px;"></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 15px; min-height: 46px; box-sizing: border-box;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#61705A" stroke-width="1.7" style="flex: none;"><path d="M5.5 6.5 L18.5 6.5 M9 6.5 V4.5 h6 v2 M7 6.5 l1 13 h8 l1 -13"/></svg>
          <span style="flex: 1; font-size: 14.5px; color: #26301F;">不要再提的</span>
          <span style="font-size: 13px; color: #8A9683; font-variant-numeric: tabular-nums;">2 条</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A7B2A0" stroke-width="2" style="flex: none;"><path d="M9 5 L16 12 L9 19"/></svg>
        </div>
      </div>
      <p style="margin: 2px 0 0; font-size: 13px; line-height: 1.8; color: #61705A;">每一条都能看到它是从哪次对话来的，可以改，也可以删。</p>
    </section>

    <!-- 账号，最轻 -->
    <section style="display: flex; flex-direction: column; gap: 11px;">
      <h2 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 15px; color: #414C39; letter-spacing: .08em;">设置</h2>
      <div style="background: #F4F2E6; border: 1px solid #C3D0BA; border-radius: 3px; display: flex; align-items: center; gap: 12px; padding: 14px 15px; min-height: 46px; box-sizing: border-box;">
        <span style="flex: 1; font-size: 14.5px; color: #26301F;">新记录默认给团子看</span>
        <span style="width: 44px; height: 26px; border-radius: 13px; background: #6F8C66; position: relative; flex: none;">
          <span style="position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 10px; background: #F4F2E6;"></span>
        </span>
      </div>
    </section>

  </div>

  <nav style="display: flex; background: rgba(220,230,214,.96); border-top: 1px solid #C3D0BA;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 22px; color: rgba(38,48,31,.42);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M9.6 21.6 C8.4 21.6 7.9 20.9 7.9 19.9 L7.9 15.6 C7.9 14.1 8.2 13 8.8 12 C8.4 10.4 8.4 8.4 8.7 6.6 L8.2 2.2 C8.1 1.5 8.6 1.2 9.2 1.6 L13.1 4 C14.4 3.7 15.6 3.7 16.9 4 L20.8 1.6 C21.4 1.2 21.9 1.5 21.8 2.2 L21.3 6.6 C21.6 8.4 21.6 10.4 21.2 12 C21.8 13 22.1 14.1 22.1 15.6 L22.1 19.9 C22.1 20.9 21.6 21.6 20.4 21.6 Z"/><path d="M9 20.4 C6.2 21.2 3.4 19.6 2.7 16.8 C2.1 14.4 3.2 12.2 5.1 11.6" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round"/></svg>
      <span style="font-size: 10px; letter-spacing: .1em;">陪伴</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 22px; color: rgba(38,48,31,.42);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5.5 3.5 h13 v17 h-13 Z"/><path d="M8.5 8 h7 M8.5 11.6 h7 M8.5 15.2 h4.5"/></svg>
      <span style="font-size: 10px; letter-spacing: .1em;">日记</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 22px; color: #26301F;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8.4" r="3.8"/><path d="M5 20.5 c0 -3.9 3.1 -6.5 7 -6.5 s7 2.6 7 6.5"/></svg>
      <span style="font-size: 10px; letter-spacing: .1em;">我的</span>
    </div>
  </nav>

</div>
</x-dc>

</html>
