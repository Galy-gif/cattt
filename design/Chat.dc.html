<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    a { color: #C25A3E; } a:hover { color: #9E4630; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #BCCFC0;">

  <!-- 综合色彩虚化背景：世界退成认不出的色场 -->
  <div style="position: absolute; inset: 0; background:
      radial-gradient(120% 62% at 18% 6%, #CFE3EA 0%, rgba(207,227,234,0) 58%),
      radial-gradient(96% 50% at 88% 22%, #C6D9C4 0%, rgba(198,217,196,0) 62%),
      radial-gradient(110% 56% at 12% 74%, #9FC0C2 0%, rgba(159,192,194,0) 60%),
      radial-gradient(120% 60% at 82% 96%, #B0C8AD 0%, rgba(176,200,173,0) 64%),
      linear-gradient(168deg, #C9DCC7, #AEC6AF);"></div>

  <!-- 顶部：日记来源条，可收起 -->
  <div style="position: relative; padding: 58px 16px 0;">
    <div style="display: flex; align-items: center; gap: 10px; background: rgba(246,238,220,.9); border: 1px solid rgba(224,212,180,.8); border-radius: 3px; padding: 10px 12px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#C9823F" style="flex: none;"><ellipse cx="12" cy="15.5" rx="5.6" ry="4.4"/><circle cx="6.6" cy="9.6" r="2.1"/><circle cx="11" cy="7.4" r="2.2"/><circle cx="15.6" cy="8.4" r="2.1"/></svg>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 10.5px; color: #A8865A; letter-spacing: .06em;">从今天的这条继续</span>
        <span style="font-size: 13px; color: #26301F; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">早班地铁太挤了，站了一路。</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9683" stroke-width="1.8" style="flex: none;"><path d="M6 15 L12 9 L18 15"/></svg>
    </div>
  </div>

  <!-- 对话：猫话左，人话右 -->
  <div style="position: relative; flex: 1; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">

    <div style="display: flex; gap: 9px; align-items: flex-end; max-width: 82%;">
      <svg width="30" height="30" viewBox="0 0 120 80" style="flex: none; margin-bottom: 2px;">
        <g stroke="#6B5B4A" stroke-width="3" stroke-linejoin="round">
          <path d="M28 46 C24 26 42 18 60 18 C78 18 96 26 92 46 Z" fill="#E3A05C"/>
          <path d="M34 24 L31 8 L46 20 Z" fill="#E3A05C"/><path d="M76 22 L80 6 L64 18 Z" fill="#E3A05C"/>
          <ellipse cx="46" cy="34" rx="3.4" ry="4" fill="#3A3229" stroke="none"/>
          <ellipse cx="62" cy="34" rx="3.4" ry="4" fill="#3A3229" stroke="none"/>
        </g>
      </svg>
      <div style="background: rgba(244,242,230,.95); border-radius: 3px 12px 12px 12px; padding: 11px 14px;">
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #26301F;">站一路很累吧。</p>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end;">
      <div style="background: rgba(195,208,186,.96); border-radius: 12px 3px 12px 12px; padding: 11px 14px; max-width: 78%;">
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #26301F;">还行，就是有点烦</p>
      </div>
    </div>

    <div style="display: flex; gap: 9px; align-items: flex-end; max-width: 84%;">
      <span style="width: 30px; flex: none;"></span>
      <div style="background: rgba(244,242,230,.95); border-radius: 3px 12px 12px 12px; padding: 11px 14px;">
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #26301F;">那就先不用讲道理。<br>桂花是真的开了吗，我没出去过。</p>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end;">
      <div style="background: rgba(195,208,186,.96); border-radius: 12px 3px 12px 12px; padding: 11px 14px; max-width: 78%;">
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #26301F;">开了，一整条街都是</p>
      </div>
    </div>

    <!-- 流式生成中 -->
    <div style="display: flex; gap: 9px; align-items: flex-end;">
      <span style="width: 30px; flex: none;"></span>
      <div style="background: rgba(244,242,230,.95); border-radius: 3px 12px 12px 12px; padding: 14px 16px; display: flex; gap: 5px; align-items: center;">
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #8A9683;"></span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #A7B2A0;"></span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #C3D0BA;"></span>
      </div>
    </div>

  </div>

  <!-- 输入区：无新建会话 -->
  <div style="position: relative; padding: 12px 14px 30px; display: flex; align-items: center; gap: 10px; background: rgba(220,230,214,.8); border-top: 1px solid rgba(38,48,31,.14); backdrop-filter: blur(12px);">
    <div style="flex: 1; display: flex; align-items: center; gap: 10px; min-height: 46px; background: rgba(244,242,230,.97); border-radius: 4px; padding: 0 14px;">
      <span style="flex: 1; font-size: 15px; color: #8A9683;">说点什么</span>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8A9683" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5 a6.5 6.5 0 0 0 13 0 M12 18 v3"/></svg>
    </div>
    <button style="width: 46px; height: 46px; flex: none; border: 0; border-radius: 4px; background: #C25A3E; color: #F8EDE6; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #9E4630; cursor: pointer;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 V5 M6 11 L12 5 L18 11"/></svg>
    </button>
  </div>

</div>
</x-dc>
